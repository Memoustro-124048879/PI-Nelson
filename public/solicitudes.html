<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes - SIGAF-QR</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
            </div>
            <div class="brand-text">
                <h1>SIGAF-QR</h1>
                <span>Gestión de Activos</span>
            </div>
        </div>

        <div class="user-profile">
            <div class="avatar" id="sidebar-avatar">MT</div>
            <div class="user-info">
                <h2 id="sidebar-name">Cargando...</h2>
                <p id="sidebar-role">...</p>
            </div>
        </div>

        <ul class="nav-menu">
            <li class="nav-item">
                <a href="dashboard.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="activos.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"></path><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path></svg>
                    Activos
                </a>
            </li>
            <li class="nav-item">
                <a href="solicitudes.html" class="nav-link active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Solicitudes
                </a>
            </li>
            <li class="nav-item">
                <a href="reportes.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                    Reportes
                </a>
            </li>
            <li class="nav-item">
                <a href="usuarios.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    Empleados
                </a>
            </li>
        </ul>

        <button class="scan-btn" id="btn-scan">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="12" x2="21" y2="12"></line></svg>
            Escanear QR
        </button>

        <ul class="bottom-nav">
            <li class="nav-item">
                <a href="perfil.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Mi Perfil
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" id="btn-logout" style="color: #ef4444;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Cerrar Sesión
                </a>
            </li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content-wrapper-centered">
            <header class="page-header">
                <div class="page-title">
                    <h2>Solicitudes de Activos</h2>
                    <p>Gestione las solicitudes de activos del personal</p>
                </div>
                <button class="btn-primary" id="btn-new-request">
                    + Nueva Solicitud
                </button>
            </header>

            <div class="toolbar">
                <div class="search-bar">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="search-input" placeholder="Buscar por activo o solicitante...">
                </div>
                <div class="filter-group">
                    <button class="btn-filter active" data-filter="all">Todas</button>
                    <button class="btn-filter" data-filter="pending">Pendientes</button>
                    <button class="btn-filter" data-filter="approved">Aprobadas</button>
                </div>
            </div>

            <div id="requests-container">
                <!-- Loaded via JS -->
            </div>
        </div>
    </main>

    <!-- Modal Nueva Solicitud -->
    <div class="modal-overlay" id="request-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Nueva Solicitud de Activo</h3>
                <button class="modal-close" id="btn-close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="new-request-form">
                    <div class="form-group">
                        <label class="form-label">Activo <span>*</span></label>
                        <select class="form-control" id="activo_id" required>
                            <option value="">Seleccione un activo</option>
                            <!-- Options logic loaded via JS -->
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Fecha Programada <span>*</span></label>
                            <input type="datetime-local" class="form-control" id="fecha_programada" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Realizará el Cambio <span>*</span></label>
                            <select class="form-control" id="responsable_cambio" required>
                                <option value="">Seleccione un responsable</option>
                                <!-- Options populated via JS from sigaf_users -->
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Nueva Ubicación <span>*</span></label>
                        <select class="form-control" id="nueva_ubicacion" required>
                            <option value="">Seleccione una ubicación</option>
                            <option value="Planta Principal - Área de Ensamble">Planta Principal - Área de Ensamble</option>
                            <option value="Planta Principal - Línea de Producción A">Planta Principal - Línea de Producción A</option>
                            <option value="Planta Principal - Línea de Producción B">Planta Principal - Línea de Producción B</option>
                            <option value="Planta Principal - Almacén Central">Planta Principal - Almacén Central</option>
                            <option value="Almacén de Materia Prima">Almacén de Materia Prima</option>
                            <option value="Cuarto de Máquinas">Cuarto de Máquinas</option>
                            <option value="Taller de Soldadura">Taller de Soldadura</option>
                            <option value="Laboratorio de Calidad">Laboratorio de Calidad</option>
                            <option value="Laboratorio de Prototipos">Laboratorio de Prototipos</option>
                            <option value="Oficinas Administrativas">Oficinas Administrativas</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Nivel de Urgencia <span>*</span></label>
                        <select class="form-control" id="urgencia" required>
                            <option value="Baja">Baja</option>
                            <option value="Media" selected>Media</option>
                            <option value="Alta">Alta</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Motivo del Cambio <span>*</span></label>
                        <textarea class="form-control" id="motivo" placeholder="Describa el motivo de la solicitud de cambio..." required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="btn-cancel-modal">Cancelar</button>
                <button class="btn-primary" id="btn-submit-request" form="new-request-form">Enviar Solicitud</button>
            </div>
        </div>
    </div>

    <script src="js/solicitudes.js"></script>
</body>
</html>
